[project]
name = "grill"
version = "0.1.0"
description = "UV radiation index for Basel, Switzerland — multi-source fused estimates"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "pvlib>=0.11.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
uv-index = "scripts.current_uv:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "ty>=0.0.1a6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
